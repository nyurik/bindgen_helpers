name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall' }
      - run: just ci-test

  test-msrv:
    name: Test MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just' }
      - name: Read MSRV
        id: msrv
        run: echo "value=$(just get-msrv)" >> $GITHUB_OUTPUT
      - name: Install MSRV Rust ${{ steps.msrv.outputs.value }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
          # rustfmt is used by the tests
          components: rustfmt
      - run: just ci-test-msrv

  coverage:
    name: Code Coverage
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }
      - name: Generate code coverage
        run: just ci-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/codecov.info

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    needs: [ test, test-msrv ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ ci-passed ]
    if: |
      always()
      && needs.ci-passed.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'nyurik'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@v0.5
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@v0.5
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Attach the Linux CLI binary to the GitHub release that release-plz has just created
  release-binaries:
    needs: [ release-plz ]
    if: needs.release-plz.outputs.releases_created == 'true'
    # The oldest supported runner, so that the binary needs an older glibc
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Find the release tag
        id: tag
        env:
          RELEASES: ${{ needs.release-plz.outputs.releases }}
        run: |
          # The library makes the tag and the GitHub release, see release-plz.toml
          tag="$(jq -r '.[] | select(.package_name == "bindgen_helpers") | .tag' <<< "$RELEASES")"
          cli="$(jq -r '.[] | select(.package_name == "bindgen_helpers_cli") | .version' <<< "$RELEASES")"
          if [ -z "$tag" ] || [ "$tag" != "v$cli" ]; then
            echo "::error::bindgen_helpers and bindgen_helpers_cli were not released together: $RELEASES"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with: { ref: 'refs/tags/${{ steps.tag.outputs.value }}' }
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: bindgen-helper
          package: bindgen_helpers_cli
          target: x86_64-unknown-linux-gnu
          locked: true
          checksum: sha256
          ref: 'refs/tags/${{ steps.tag.outputs.value }}'
          token: ${{ secrets.GITHUB_TOKEN }}
