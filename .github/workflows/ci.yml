name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'Attach the bindgen-helper binaries to this existing release, e.g. v0.6.2; empty for none'
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall' }
      - run: just ci-test

  test-msrv:
    name: Test MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just' }
      - name: Read MSRV
        id: msrv
        run: echo "value=$(just get-msrv)" >> $GITHUB_OUTPUT
      - name: Install MSRV Rust ${{ steps.msrv.outputs.value }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
          # rustfmt is used by the tests
          components: rustfmt
      - run: just ci-test-msrv

  coverage:
    name: Code Coverage
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }
      - name: Generate code coverage
        run: just ci-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/codecov.info

  # Build the release binaries on every run, kept as its artifacts, which the release-plz job attaches to a release.
  # Run by hand with cli_tag, it builds that tag.
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest supported runners, so that the binary needs an older glibc. Not musl: a static musl
          # binary cannot load libclang at runtime.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled: Apple's toolchain builds both architectures on Apple silicon
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Cross-compiled with the runner's MSVC ARM64 tools
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cli_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just dist '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: bindgen-helper-${{ matrix.target }}
          path: target/dist/bindgen-helper-${{ matrix.target }}.*
          if-no-files-found: error

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    needs: [ test, test-msrv, build-binaries ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ ci-passed ]
    if: |
      always()
      && needs.ci-passed.result == 'success'
      && github.repository_owner == 'nyurik'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_dispatch' && startsWith(inputs.cli_tag, 'v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - if: github.event_name == 'push'
        name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@v0.5
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # The library makes the `vX.Y.Z` tag and GitHub release for both crates, see release-plz.toml
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: Find the tag of the release, if the CLI was released
        id: cli
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          cli="$(jq -r '.[] | select(.package_name == "bindgen_helpers_cli") | .version' <<< "$RELEASES")"
          tag="$(jq -r '.[] | select(.package_name == "bindgen_helpers") | .tag' <<< "$RELEASES")"
          if [ -n "$cli" ] && [ "$tag" != "v$cli" ]; then
            echo "::error::bindgen_helpers and bindgen_helpers_cli were not released together: $RELEASES"
            exit 1
          fi
          echo "tag=${cli:+$tag}" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@v0.5
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Attach this run's binaries to the release just made, or to cli_tag's; the release's notes are kept
      - if: steps.cli.outputs.tag || inputs.cli_tag
        uses: actions/download-artifact@v8
        with: { pattern: bindgen-helper-*, merge-multiple: true, path: target/dist }
      - if: steps.cli.outputs.tag || inputs.cli_tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.cli.outputs.tag || inputs.cli_tag }}
          files: target/dist/*
          fail_on_unmatched_files: true
