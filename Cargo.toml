[package]
name = "bindgen_helpers"
description = "Utilities to rename, change case, and fix Rust code generated by bindgen from C headers"
keywords = ["ffi", "bindgen", "rename", "case", "convert"]
categories = ["development-tools::ffi", "development-tools::build-utils"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Load rename and `#define` enum rules from a TOML file: `HelperConfig`, `BindingsBuilder::with_config_file`, etc.
config = ["dep:serde", "dep:toml"]

[dependencies]
bindgen.workspace = true
convert_case.workspace = true
regex.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [".", "cli", "tests"]
default-members = [".", "cli", "tests"]

[workspace.package]
version = "0.6.1"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
repository = "https://github.com/nyurik/bindgen_helpers"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.71"

[workspace.dependencies]
# The library accepts wide ranges of its dependencies. `Cargo.msrv.lock` holds the minimal versions,
# which `just ci-test-msrv` compiles with the MSRV toolchain. `just ci-test` uses `Cargo.lock`, which the CLI ships with.
bindgen = ">=0.72.0"  # 0.72 is the first with the current `ParseCallbacks::item_name` signature
bindgen_helpers = { path = ".", version = "0.6.1" }
convert_case = ">=0.8.0, <0.13"  # 0.8 is the first with `Case<'a>`
insta = "1.43.1"
regex = "1.5.6"
serde = { version = "1.0.150", features = ["derive"] }
thiserror = ">=1.0.40, <3"
toml = ">=0.7.8, <2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Restrictions
disallowed_methods = "forbid"
panic_in_result_fn = "warn"
todo = "warn"
unwrap_used = "warn"
# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Relax some
multiple_crate_versions = "allow"

#[patch.crates-io]
#bindgen = { path = "../../rust/lang/rust-bindgen/bindgen" }
